<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f6c760" />
    <meta name="description" content="셰이디의 뒤틀린 아공간에서 탈출하는 방 탐험 액션 로그라이트" />
    <link rel="manifest" href="./manifest.webmanifest?v=23" />
    <link rel="icon" href="./icon.svg?v=23" type="image/svg+xml" />
    <link rel="preload" href="./assets/butter-2d32/directions.png" as="image" type="image/png" fetchpriority="high" />
    <link rel="preload" href="./assets/trickcal-heroes.webp?v=23" as="image" type="image/webp" />
    <link rel="preload" href="./assets/ui-icons.svg?v=23" as="image" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=33" />
    <title>셰이디의 아공간 탈출</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="hud">
        <section class="hero-status">
          <div class="portrait" id="portrait" aria-hidden="true"></div>
          <div class="health-info">
            <div class="hero-line">
              <strong id="hero-name">버터</strong>
              <span id="room-label">탐색 1</span>
            </div>
            <div class="health-bar"><span id="health-fill"></span><b id="health-label">90 / 90</b></div>
          </div>
        </section>
        <section class="grade-status">
          <span class="grade lower">저학년 <b id="lower-level">LV.1</b></span>
          <span class="grade upper">고학년 <b id="upper-level">LV.1</b></span>
        </section>
      </header>

      <section class="game-stage" id="game-stage">
        <canvas id="game-canvas" aria-label="셰이디의 아공간 게임 화면"></canvas>

        <div class="room-banner" id="room-banner">
          <small id="room-kicker">1교시</small>
          <strong id="room-title">뒤틀린 교실</strong>
        </div>

        <div class="item-strip" id="item-strip" aria-label="보유 아이템"></div>
        <aside class="minimap" id="minimap" aria-label="아공간 지도"></aside>
        <div class="resource-bar" aria-label="소지품">
          <span title="열쇠"><svg class="ui-icon"><use href="./assets/ui-icons.svg?v=23#key"></use></svg><b id="key-count">1</b></span>
          <span title="폭탄"><svg class="ui-icon"><use href="./assets/ui-icons.svg?v=23#bomb"></use></svg><b id="bomb-count">1</b></span>
        </div>
        <button class="pause-button" id="pause-button" aria-label="일시 정지">Ⅱ</button>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <div class="joystick move-stick" id="move-stick" aria-label="이동 조이스틱">
          <span class="stick-label">이동</span>
          <span class="joystick-knob" id="move-knob"></span>
        </div>
        <div class="joystick aim-stick" id="aim-stick" aria-label="공격 조이스틱">
          <span class="stick-label">공격</span>
          <span class="joystick-knob attack-knob" id="aim-knob"></span>
        </div>

        <div class="ability-buttons">
          <button class="ability bomb-ability" id="bomb-button">
            <span><svg class="ui-icon"><use href="./assets/ui-icons.svg?v=23#bomb"></use></svg></span>
            <b>폭탄</b>
            <small id="bomb-label">R · 1</small>
          </button>
          <button class="ability lower-ability" id="lower-ability">
            <span id="lower-icon"><svg class="ui-icon"><use href="./assets/ui-icons.svg?v=23#slingshot"></use></svg></span>
            <b id="lower-name">말썽 유도탄</b>
            <small id="lower-cooldown">패시브</small>
          </button>
          <button class="ability upper-ability" id="upper-ability">
            <span id="upper-icon"><svg class="ui-icon"><use href="./assets/ui-icons.svg?v=23#attack"></use></svg></span>
            <b id="upper-name">왕새총 짱돌</b>
            <small id="upper-cooldown">READY</small>
          </button>
        </div>

        <div class="room-transition" id="room-transition" aria-hidden="true"></div>

        <section class="start-screen" id="start-screen">
          <p class="kicker">ROOM ESCAPE ROGUELITE</p>
          <h1>셰이디의<br /><em>아공간 탈출</em></h1>
          <p class="intro">자동 생성된 아공간을 자유롭게 탐색하고<br />열쇠와 폭탄으로 숨은 방을 찾으세요.</p>
          <div class="character-select" id="character-select">
            <button class="character-card selected" data-character="butter">
              <span class="character-art butter-art"><svg viewBox="0 0 627 627" aria-hidden="true"><image href="./assets/butter-2d32/directions.png" width="1254" height="1254" /></svg></span>
              <span class="character-copy"><small>원거리</small><strong>버터</strong><b>새총 · 유도탄 · 왕짱돌</b></span>
            </button>
            <button class="character-card" data-character="komi">
              <span class="character-art komi-art"></span>
              <span class="character-copy"><small>근거리</small><strong>코미</strong><b>베개 · 반사 낮잠 · 거대화</b></span>
            </button>
          </div>
          <button class="primary-button" id="start-button">아공간 입장</button>
          <p class="controls-help">WASD 이동 · 방향키 공격 · Q/E 능력 · R 폭탄</p>
        </section>

        <section class="item-screen" id="item-screen" hidden>
          <div class="choice-heading">
            <p>ROOM CLEAR!</p>
            <h2>하나만 챙기자</h2>
            <span>보물방의 아이템을 하나 선택하세요</span>
          </div>
          <div class="item-cards" id="item-cards"></div>
        </section>

        <section class="pause-screen" id="pause-screen" hidden>
          <div>
            <span>Ⅱ</span>
            <h2>잠깐 쉬는 중</h2>
            <button class="primary-button" id="resume-button">계속하기</button>
          </div>
        </section>

        <section class="result-screen" id="result-screen" hidden>
          <div class="result-card">
            <span class="result-emblem" id="result-emblem">★</span>
            <p id="result-kicker">ESCAPED!</p>
            <h2 id="result-title">아공간에서 탈출했다!</h2>
            <p id="result-copy"></p>
            <div class="result-stats">
              <div><strong id="result-rooms">1</strong><span>돌파 방</span></div>
              <div><strong id="result-kills">0</strong><span>처치</span></div>
              <div><strong id="result-items">0</strong><span>아이템</span></div>
            </div>
            <button class="primary-button" id="restart-button">다시 들어가기</button>
          </div>
        </section>
      </section>
    </main>

    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
          .catch(() => {});
      }
      if ("caches" in window) {
        caches.keys().then((keys) => Promise.all(keys.map((key) => caches.delete(key)))).catch(() => {});
      }
    </script>
    <script type="module" src="./app.js?v=33"></script>
  </body>
</html>
