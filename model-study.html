<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>버터 · 모델 수정 시안</title>
  <style>
    :root{font:16px/1.6 system-ui,sans-serif;color:#60463d;background:#faf4e9;color-scheme:light}
    *{box-sizing:border-box}body{max-width:1000px;margin:auto;padding:28px 20px 60px}
    h1{font-size:clamp(25px,5vw,36px);line-height:1.3;margin:12px 0}h2{font-size:20px;margin-top:36px}
    .tag{display:inline-block;padding:4px 12px;border-radius:20px;background:#f3e1b6;font-size:13px}
    p{margin:12px 0}a{color:#87522b;text-underline-offset:4px}
    .comparison,.angles,.poses{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
    .angles{grid-template-columns:repeat(4,minmax(0,1fr))}
    figure{margin:0;border:1px solid #ddcdbb;border-radius:18px;overflow:hidden;background:#fffaf1}
    img{display:block;width:100%;height:auto;background:radial-gradient(ellipse 13% 3% at 50% 87%,#e1cdbb 98%,transparent 100%)}
    figcaption{padding:11px 14px;border-top:1px solid #eee0cf;font-weight:600;text-align:center}
    .muted{color:#917c70;font-size:14px}.notice{padding:14px 18px;background:#f4ead9;border-radius:12px}
    @media(max-width:650px){body{padding:20px 12px 40px}.angles{grid-template-columns:repeat(2,minmax(0,1fr))}.comparison{gap:8px}figcaption{font-size:14px;padding:10px 6px}}
  </style>
</head>
<body>
  <span class="tag">모델 수정 시안 · 게임에는 아직 미적용</span>
  <h1>덩어리감은 줄이고, 버터답게.</h1>
  <p>납작한 얼굴과 눈 · 이어지는 머리카락 · 짧은 몸통과 손발 · 몸 가까이에 든 새총</p>
  <section class="comparison" aria-label="기존 모델과 수정 시안 비교">
    <figure><img src="./assets/butter-study/before.png?v=study27" alt="기존 모델 정면, 같은 해상도로 촬영" width="384" height="384"><figcaption>기존 모델</figcaption></figure>
    <figure><img src="./assets/butter-study/front.png?v=study27" alt="큰 머리와 짧은 몸으로 다시 만든 버터 정면" width="384" height="384"><figcaption>수정 시안</figcaption></figure>
  </section>
  <h2>네 방향 정지 모습</h2>
  <section class="angles">
    <figure><img src="./assets/butter-study/front.png?v=study27" alt="버터 정면" width="384" height="384"><figcaption>정면</figcaption></figure>
    <figure><img src="./assets/butter-study/left.png?v=study27" alt="버터 왼쪽" width="384" height="384"><figcaption>왼쪽</figcaption></figure>
    <figure><img src="./assets/butter-study/right.png?v=study27" alt="버터 오른쪽" width="384" height="384"><figcaption>오른쪽</figcaption></figure>
    <figure><img src="./assets/butter-study/back.png?v=study27" alt="버터 뒷모습과 중앙 꼬리" width="384" height="384"><figcaption>뒷모습</figcaption></figure>
  </section>
  <h2>팔을 벌리지 않는 새총 준비 자세</h2>
  <section class="poses">
    <figure><img src="./assets/butter-study/front-ready.png?v=study27" alt="몸 가까이 새총을 잡은 정면 자세" width="384" height="384"><figcaption>정면 · 준비 자세</figcaption></figure>
    <figure><img src="./assets/butter-study/left-ready.png?v=study27" alt="새총 줄을 당기는 왼쪽 자세" width="384" height="384"><figcaption>왼쪽 · 준비 자세</figcaption></figure>
  </section>
  <p class="notice">먼저 얼굴과 비율을 확인하는 단계야. 기존 게임 모델·스프라이트는 바꾸지 않았어.</p>
  <p><a href="./assets/models/butter-study.blend" download>수정 시안 Blender 원본</a> · <a href="./?v=rig26">게임으로 돌아가기</a></p>
  <script type="module">
    await Promise.all([...document.images].map(img=>img.decode()));document.body.dataset.ready="true";
  </script>
</body>
</html>
