<!doctype html>
<html lang="ko">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>버터 모델 렌더 프레임</title>
<style>
  body { margin:24px; background:#252536; color:#f6e7d0; font:15px system-ui; }
  h1 {font-size:24px;} h2 {margin-top:30px;}
  section {display:grid;grid-template-columns:repeat(8,minmax(80px,1fr));gap:8px;}
  figure {margin:0;background:#3b3b50;border:1px solid #62617a;border-radius:8px;overflow:hidden;}
  canvas {display:block;width:100%;background:repeating-conic-gradient(#dfd1c8 0% 25%,#cbbaa9 0% 50%) 0 / 24px 24px;}
  figcaption {padding:6px;text-align:center;font-size:12px;}
  a {color:#ffe592;}
  @media(max-width:700px){body{margin:12px;}section{grid-template-columns:repeat(3,minmax(80px,1fr));}}
</style>
<h1>버터 모델 렌더 · 전신 500프레임</h1>
<p><a href="./motion-preview.html?v=26">애니메이션 비교</a> · <a href="./?v=rig26">게임으로 돌아가기</a> · <a href="./assets/models/butter.blend" download>Blender 원본</a></p>
<p>네 방향 모두 같은 모델에서 렌더링한다. 12단계 걸음 × 8단계 사격을 조합하며, 아래에서 각 단계를 확인할 수 있다.</p>
<label>이동 사격의 보행 단계 <input id="gait" type="range" min="0" max="11" value="0"> <output>0</output></label>
<main></main>
<script type="module">
  const manifest=await (await fetch("./assets/butter-model.json?v=26")).json();
  const atlas=new Image();atlas.src="./assets/butter-model.webp?v=26";await atlas.decode();
  function show(){
    const gait=Number(document.querySelector("input").value);document.querySelector("output").value=gait;
    document.querySelector("main").replaceChildren();
    for(const [vi,title] of ["정면 / 아래","왼쪽","오른쪽","후면 / 위"].entries())for(const [clip,label] of [["walk","걷기"],["shoot","장전·발사"],["walkShoot","이동 사격"],["high","고학년"]]){
      const heading=document.createElement("h2");heading.textContent=title+" · "+label;
      const section=document.createElement("section");document.querySelector("main").append(heading,section);
      const layout=manifest.clips[clip],count=clip==="walk"?12:8;
      for(let f=0;f<count;f++){
        const figure=document.createElement("figure"),canvas=document.createElement("canvas"),caption=document.createElement("figcaption");
        canvas.width=canvas.height=128;
        const index=vi*128+layout.offset+(clip==="walkShoot"?gait*8+f:f);
        canvas.getContext("2d").drawImage(atlas,index%16*128,Math.floor(index/16)*128,128,128,0,0,128,128);
        caption.textContent=`${label} ${f+1}/${count}`;figure.append(canvas,caption);section.append(figure);
      }
    }
  }
  document.querySelector("input").addEventListener("input",show);show();
  document.body.dataset.ready="true";
</script>
</html>
