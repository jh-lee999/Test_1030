name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install sprite inspection tools
        timeout-minutes: 5
        run: |
          if command -v identify >/dev/null && command -v convert >/dev/null; then
            identify -version
            exit 0
          fi
          # Hosted images normally have usable package indexes. Refresh only on
          # failure; unrelated apt feeds must not leave Pages waiting indefinitely.
          apt_network=(-o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          if ! sudo apt-get "${apt_network[@]}" install --yes imagemagick; then
            sudo apt-get "${apt_network[@]}" update
            sudo apt-get "${apt_network[@]}" install --yes imagemagick
          fi

      - name: Check game, sprite bounds and approved art
        run: |
          node --check app.js
          node --check survivor68.js
          node --check survivor68-engine.js
          node --check survivor68-renderer.js
          node --check survivor68-save.js
          node --check survivor69.js
          node --check survivor69-engine.js
          node --check survivor69-world.js
          node --check survivor69-content.js
          node --check survivor69-profile.js
          node --check survivor69-renderer.js
          node --check survivor70.js
          node --check survivor70-art.js
          node --check survivor70-scenery.js
          node --check survivor70-renderer.js
          node --check survivor71.js
          node --check survivor71-engine.js
          node --check survivor71-world.js
          node --check survivor71-content.js
          node --check survivor71-profile.js
          node --check survivor71-renderer.js
          node --check survivor71-scenery.js
          node --check survivor71-art.js
          node --check butter-gun-motion71.js
          node tools/check-source71.mjs
          node --check survivor72.js
          node --check survivor72-engine.js
          node --check survivor72-content.js
          node --check survivor72-profile.js
          node --check survivor72-renderer.js
          node --check survivor72-scenery.js
          node --check survivor72-art.js
          node --check survivor72-camera.js
          node --check survivor72-boulder.js
          node tools/check-art72.mjs
          node --check dungeon73.js
          node --check dungeon73-engine.js
          node --check dungeon73-world.js
          node --check dungeon73-content.js
          node --check dungeon73-save.js
          node --check dungeon73-renderer.js
          node tools/check-art73.mjs
          node --check dungeon74.js
          node --check dungeon74-engine.js
          node --check dungeon74-world.js
          node --check dungeon74-content.js
          node --check dungeon74-save.js
          node --check dungeon74-renderer.js
          node tools/check-art74.mjs
          node --check dungeon75.js
          node --check dungeon75-content.js
          node --check dungeon75-engine.js
          node --check dungeon75-save.js
          node --check dungeon75-renderer.js
          node tools/check-art75.mjs
          node --check dice.js
          node --check dice55.js
          node --check dice-selection.js
          node --check poker-engine.js
          node --check poker.js
          node --check poker-feedback.js
          node --check poker-profile.js
          node --check poker-release-ui.js
          node --check poker-audio.js
          node --check poker-order-ui.js
          node --check poker-hand-ui.js
          node --check dice-run-engine.js
          node --check dice-engine.js
          node --check trickcal-artifacts.js
          node --check dice-renderer.js
          node --check dice-effects.js
          node --check bonk.js
          node --check bonk-engine.js
          node --check bonk-renderer.js
          node --check bonk-ui.js
          node --check bonk-aim.js
          node --check platformer.js
          node --check platformer-engine.js
          node --check platformer-build.js
          node --check platformer-paths.js
          node --check platformer-threats.js
          node --check platformer-economy.js
          node --check platformer-enemies.js
          node --check platformer-drone.js
          node --check platformer-audio.js
          node --check platformer-art.js
          node --check platformer-world.js
          node --check platformer-physics.js
          node --check platformer-renderer.js
          npm test
          npm run check:sprites
          npm run check:butter-canon
          npm run check:butter-original
          npm run check:platformer-art

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static game
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
